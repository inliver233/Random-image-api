name = "random-image-edge"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Non-secret defaults. Put IMAGE_EDGE_SECRET via:
#   wrangler secret put IMAGE_EDGE_SECRET
[vars]
ORIGIN_HOST = "i.pximg.net"
# Emergency mirrors only (path-compatible). Prefer multi-host CSV; single host still supported.
# Example: "i.pixiv.re,i.pixiv.cat,i.pixiv.nl"
FALLBACK_MIRROR_HOST = ""
FALLBACK_MIRROR_HOSTS = ""
CACHE_TTL_SECONDS = "604800"
ERROR_CACHE_TTL_SECONDS = "30"
# Public image safety/backpressure bounds. Large or unknown-length objects stream only.
MAX_IMAGE_BYTES = "33554432"
CACHE_WRITE_MAX_BYTES = "8388608"
MAX_IMAGE_WIDTH = "16384"
MAX_IMAGE_HEIGHT = "16384"
MAX_IMAGE_PIXELS = "100000000"
# Per-isolate cold-fill coordination; stalled streams are canceled and release their slot.
MAX_CONCURRENT_COLD_FILLS = "4"
COLD_FLIGHT_WAIT_MS = "1500"
COLD_STREAM_IDLE_TIMEOUT_MS = "15000"
COLD_STREAM_TOTAL_TIMEOUT_MS = "120000"
STORAGE_WRITE_TIMEOUT_MS = "5000"
# Soft-open origin circuit after this many 403s in the window (isolate-local).
ORIGIN_403_CIRCUIT_THRESHOLD = "8"
ORIGIN_403_CIRCUIT_WINDOW_MS = "60000"
ORIGIN_403_CIRCUIT_OPEN_MS = "30000"
# R2 modes when [[r2_buckets]] is bound: off | read_through (default) | r2_only
R2_MODE = "read_through"
# Isolate token-bucket on Cache MISS /u/* (after HMAC). 0 = disable. Default 3000.
RATE_LIMIT_RPM = "3000"
# RATE_LIMIT_BURST = "300"
# Rotation: put previous secret via `wrangler secret put IMAGE_EDGE_SECRET_PREVIOUS`
# Prewarm auth: `wrangler secret put PREWARM_SECRET` (falls back to IMAGE_EDGE_SECRET)

# Optional R2 Mode B2 (uncomment + create bucket before deploy):
# [[r2_buckets]]
# binding = "R2"
# bucket_name = "random-image-pximg"

# Optional custom domain (configure in dashboard or routes):
# routes = [{ pattern = "img.example.com/*", zone_name = "example.com" }]
